<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Cairo:wght@600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1640px;height:624px;overflow:hidden}
body{font-family:'Cairo',sans-serif}
.cover{position:relative;overflow:hidden;width:1640px;height:624px;color:#fff;
  background:radial-gradient(circle at 72% 22%,#c96f91 0,transparent 42%),radial-gradient(circle at 15% 95%,#4a1d30 0,transparent 55%),linear-gradient(120deg,#4a1d30 0%,#8f3a5c 52%,#b9577d 100%)}
.pattern{position:absolute;inset:0;opacity:.08;background-image:radial-gradient(#fff 1.6px,transparent 1.6px);background-size:28px 28px}
.blob{position:absolute;border-radius:50%}
.b1{width:420px;height:420px;background:rgba(255,201,64,.14);top:-190px;right:-100px}
.b2{width:260px;height:260px;background:rgba(229,23,122,.18);bottom:-120px;left:640px}
/* hero art: the 3D items from the logo on a soft light stage, centre-left (clear of the profile picture at bottom-left) */
.stage{position:absolute;left:330px;top:70px;width:500px;height:430px}
.glow{position:absolute;left:10px;top:20px;width:480px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,236,244,.75) 45%,rgba(255,255,255,0) 70%)}
.items{position:absolute;left:20px;top:70px;width:460px;height:262px;
  background:url(logo.png) no-repeat;background-size:882px auto;background-position:-412px -22px;filter:drop-shadow(0 14px 18px rgba(74,29,48,.35))}
.sticker{position:absolute;z-index:5;font-weight:800;border-radius:999px;padding:8px 22px;box-shadow:0 5px 0 rgba(0,0,0,.2);white-space:nowrap}
.s1{background:#ffc940;color:#2f2129;font-size:26px;right:-30px;bottom:40px;transform:rotate(5deg)}
.s2{background:#3ccfae;color:#0b3d32;font-size:24px;left:-20px;top:-4px;transform:rotate(-6deg)}
.spark{position:absolute;font-size:40px}
/* text: right side, inside the mobile crop (x 266–1374) */
.txt{position:absolute;right:320px;top:78px;width:470px;text-align:right}
.kicker{display:inline-block;font-size:22px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:5px 18px;border-radius:999px}
h1{font-family:'Baloo Bhaijaan 2','Cairo';font-size:128px;line-height:1.02;font-weight:800;margin-top:8px;text-shadow:0 6px 0 rgba(0,0,0,.15)}
.tag{font-size:31px;font-weight:800;color:#ffe3ec;white-space:nowrap}
.tag b{color:#ffc940}
.sub{margin-top:8px;font-size:22px;font-weight:600;color:#f4e8d5}
.url{display:inline-block;margin-top:20px;background:#fff;color:#8f3a5c;font-size:30px;font-weight:800;padding:6px 28px;border-radius:999px;box-shadow:0 6px 0 #4a1d30;direction:ltr}
.url span{color:#e5177a}
</style></head><body><div class="cover">
<div class="pattern"></div><span class="blob b1"></span><span class="blob b2"></span>
<div class="stage">
  <div class="glow"></div><div class="items"></div>
  <span class="sticker s1">هدايا لكل مناسبة 🎁</span>
  <span class="sticker s2">جديد كل أسبوع ✨</span>
  <span class="spark" style="right:10px;top:30px">✨</span><span class="spark" style="right:30px;bottom:60px">💖</span>
</div>
<div class="txt">
  <span class="kicker">متجرك أونلاين في مصر</span>
  <h1>عالرف</h1>
  <div class="tag">تجميل • <b>عطور</b> • إكسسوارات • هدايا</div>
  <div class="sub">محتارة في الهدية؟ جرّبي مكتشف الهدايا</div>
  <span class="url">3alraf<span>.com</span></span>
</div>
</div></body></html>
