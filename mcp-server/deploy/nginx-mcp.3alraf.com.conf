# Example vhost for mcp.3alraf.com. Review against the server's existing nginx setup before enabling.
# Certificate paths assume certbot; adjust if another tool manages TLS.

limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.3alraf.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.3alraf.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.3alraf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.3alraf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Slightly above MCP_BODY_LIMIT so the app answers with its own JSON error.
    client_max_body_size 2m;

    location / {
        limit_req zone=mcp_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Optional: restrict MCP traffic to Anthropic's documented egress ranges (check platform.claude.com/docs/en/api/ip-addresses first).
    # Do not apply this to /authorize or /oauth/consent: the owner's own browser opens those.
    # location = /mcp {
    #     allow 160.79.104.0/21;
    #     allow 153.61.208.0/20;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_buffering off;
    # }
}
