; Non-docker hosts: copy to /etc/supervisor/conf.d/3alraf.conf, adjust paths/user, then `supervisorctl reread && supervisorctl update`.
; After each deploy run `php artisan queue:restart` (workers exit gracefully and supervisor starts fresh ones).
[program:3alraf-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/3alraf/backend/artisan queue:work database --sleep=1 --tries=3 --backoff=10 --max-time=3600 --memory=192
directory=/var/www/3alraf/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/3alraf/backend/storage/logs/queue.log

[program:3alraf-scheduler]
command=php /var/www/3alraf/backend/artisan schedule:work
directory=/var/www/3alraf/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/3alraf/backend/storage/logs/scheduler.log

[program:3alraf-whatsapp]
; Node WhatsApp gateway: one process, many isolated sessions; sessions restore from encrypted storage on restart.
command=node --env-file=/var/www/3alraf/whatsapp-service/.env /var/www/3alraf/whatsapp-service/src/server.js
directory=/var/www/3alraf/whatsapp-service
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/www/3alraf/backend/storage/logs/whatsapp.log

[program:3alraf-reverb]
command=php /var/www/3alraf/backend/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/3alraf/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/3alraf/backend/storage/logs/reverb.log
