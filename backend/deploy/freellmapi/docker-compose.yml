# FreeLLMAPI: private OpenAI-compatible gateway for the Product AI tools (docs/FREELLMAPI_SETUP.md).
# Runs from /opt/freellmapi (copy of this folder + your .env). Only nginx is public (nginx/llm.3alraf.com.conf);
# the container is published on 127.0.0.1:3001 only.
#   cd /opt/freellmapi && docker compose pull && docker compose up -d
name: freellmapi

services:
  freellmapi:
    # Pin a tag for reproducible upgrades: FREELLMAPI_TAG=<tag> in .env (default latest)
    image: ghcr.io/tashfeenahmed/freellmapi:${FREELLMAPI_TAG:-latest}
    container_name: freellmapi
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-3001}
    ports:
      # host side loopback only: the server listens on all interfaces INSIDE the container, nginx is the only public entry
      - "127.0.0.1:3001:${PORT:-3001}"
    volumes:
      - freellmapi-data:/app/server/data   # SQLite: provider keys (encrypted with ENCRYPTION_KEY), unified key, fallback chain
    healthcheck:
      # same probe as the image's own (node is in the image, curl is not)
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  freellmapi-data:
    name: freellmapi-data   # fixed name, so the backup command in the setup guide works whatever the folder is called
