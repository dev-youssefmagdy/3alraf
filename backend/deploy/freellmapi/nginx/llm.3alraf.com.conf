# FreeLLMAPI on its own subdomain (docs/FREELLMAPI_SETUP.md §DNS / nginx / TLS).
# Replace llm.3alraf.com with your name everywhere:  sed -i "s/llm\.3alraf\.com/$LLM_DOMAIN/g" llm.3alraf.com.conf
# Install: /etc/nginx/sites-available/llm.3alraf.com.conf → ln -s into sites-enabled → nginx -t → systemctl reload nginx.
# TLS: certbot certonly --nginx -d llm.3alraf.com  (creates the files below; auto-renewal by the certbot systemd timer).
#
# - The container listens on 127.0.0.1:3001 only; this server block is the only public way in.
# - /v1/ (the OpenAI-compatible API) is open to the internet but needs the unified key (Authorization: Bearer freellmapi-…).
# - The dashboard (/) and its admin API (/api/) can be limited to your IPs: uncomment the include lines (see freellmapi-allow.conf.example).
# - No HTTP basic auth: it would use the same Authorization header the API needs for its Bearer key.

limit_req_zone $binary_remote_addr zone=freellm_v1:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=freellm_dash:10m rate=60r/m;

map $http_upgrade $freellm_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name llm.3alraf.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name llm.3alraf.com;

    ssl_certificate     /etc/letsencrypt/live/llm.3alraf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.3alraf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:freellm_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 10m;   # base64 images for vision requests

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/llm.access.log;
    error_log  /var/log/nginx/llm.error.log warn;

    # Shared proxy settings (SSE / websocket friendly: no buffering, long reads)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $freellm_connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # OpenAI-compatible API: guarded by the unified key, rate limited per client IP
    location /v1/ {
        limit_req zone=freellm_v1 burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
    }

    # Dashboard admin API
    location /api/ {
        # include /etc/nginx/snippets/freellmapi-allow.conf;
        limit_req zone=freellm_dash burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    # Dashboard (first-run setup page is public until the admin account exists: see the setup guide)
    location / {
        # include /etc/nginx/snippets/freellmapi-allow.conf;
        limit_req zone=freellm_dash burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }
}
