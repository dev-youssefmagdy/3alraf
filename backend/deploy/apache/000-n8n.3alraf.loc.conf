# Local reverse proxy for n8n (http://n8n.3alraf.loc -> 127.0.0.1:5678). Installed by n8n/setup-local-sudo.sh.
# The file name MUST sort before 3alraf.loc.conf: that vhost has `ServerAlias *.3alraf.loc`, and Apache picks the FIRST
# name-based vhost (in load order) whose ServerName/ServerAlias matches.
# Needs: a2enmod proxy proxy_http proxy_wstunnel headers rewrite   (Apache >= 2.4.47 for `upgrade=websocket`).
<VirtualHost *:80>
    ServerName n8n.3alraf.loc

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    # one proxy hop -> N8N_PROXY_HOPS=1 in n8n/.env
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Editor push channel (/rest/push) is a WebSocket: mod_proxy_wstunnel for the explicit upgrade ...
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*)$ ws://127.0.0.1:5678/$1 [P,L]

    # ... and everything else (plus upgrade=websocket as a second safety net on Apache >= 2.4.47)
    ProxyPass        / http://127.0.0.1:5678/ upgrade=websocket keepalive=On
    ProxyPassReverse / http://127.0.0.1:5678/

    # editor + webhooks may upload a few MB; keep a sane cap
    LimitRequestBody 16777216

    ErrorLog ${APACHE_LOG_DIR}/n8n.3alraf.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/n8n.3alraf.loc_access.log combined
</VirtualHost>
