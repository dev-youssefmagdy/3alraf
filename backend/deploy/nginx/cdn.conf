# cdn.domain.com (docker: deploy/nginx/cdn.conf): static only, no PHP. Root = MEDIA_ROOT (e.g. /var/www/cdn/media). Run `php artisan media:migrate-public-to-media` once.
server {
    listen 443 ssl;
    http2 on;
    server_name cdn.domain.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /var/www/html/storage/app/media;   # MEDIA_ROOT; mount the same volume read-only
    autoindex off;
    server_tokens off;

    location / {
        # only image files; file names are content hashes, so they never change
        location ~* \.(webp|jpg|jpeg|png|gif|svg|avif)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            # CORS for *.domain.com (and the apex)
            set $cors "";
            if ($http_origin ~* "^https://([a-z0-9-]+\.)?domain\.com$") { set $cors $http_origin; }
            add_header Access-Control-Allow-Origin $cors always;
            add_header Vary Origin always;
            try_files $uri =404;
        }
        return 404;   # nothing else (no php, no html, no dotfiles)
    }
    location ~ /\. { deny all; }
}
