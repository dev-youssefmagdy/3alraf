# Production n8n: https://n8n.3alraf.com -> n8n on 127.0.0.1:5678 (systemd system service, user n8n; see n8n/README.md).
# Exact server_name beats the `*.domain.com` wildcard of app.conf, so no ordering issue in nginx.
# Certificates: `sudo certbot certonly --webroot -w /var/www/certbot -d n8n.3alraf.com` (or --nginx); paths below are certbot's.
# n8n env for this host: N8N_HOST=n8n.3alraf.com N8N_PROTOCOL=https WEBHOOK_URL=https://n8n.3alraf.com/
#   N8N_EDITOR_BASE_URL=https://n8n.3alraf.com/ N8N_PROXY_HOPS=1 N8N_SECURE_COOKIE=true N8N_LISTEN_ADDRESS=127.0.0.1

map $http_upgrade $n8n_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream n8n_backend {
    server 127.0.0.1:5678;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n.3alraf.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n8n.3alraf.com;

    ssl_certificate     /etc/letsencrypt/live/n8n.3alraf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.3alraf.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;      # certbot defaults (protocols/ciphers)
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 16m;          # editor imports / webhook payloads
    access_log /var/log/nginx/n8n.access.log;
    error_log  /var/log/nginx/n8n.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Optional: restrict the editor to the owner's IPs (webhooks stay public). The 3alraf workflows use no webhooks.
    # location / { allow 203.0.113.10; deny all; ... }

    location / {
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        # websockets (/rest/push editor channel)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $n8n_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;           # server-sent events / streaming responses
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;       # long-running manual executions in the editor
    }
}
