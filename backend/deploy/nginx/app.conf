# Central site (domain.com) + every tenant (*.domain.com) share one vhost; Laravel resolves the tenant from the Host header.
# Replace domain.com with your central domain (APP_CENTRAL_DOMAIN). Wildcard certificate: *.domain.com + domain.com.
server {
    listen 80;
    server_name domain.com *.domain.com;
    location /.well-known/acme-challenge/ { root /var/www/html/public; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name domain.com *.domain.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /build/ { access_log off; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    # uploaded public media is served by the cdn vhost; storage/app/private is never exposed.
    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }
}
