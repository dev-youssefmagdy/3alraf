# Single store on one host. Replace domain.com with the host of APP_URL.
# - domain.com      : the site (admin panel /admin, storefront /{locale}, API /api/v1, webhooks).
# - *.domain.com    : LEGACY shop subdomains only (old QR codes, affiliate links, mails, old app builds, gateway callbacks).
#                     They reach the same app so LegacyHostRedirect can 301 them to APP_URL (same path + query);
#                     webhooks/* and api/* are served directly there. Exact names (cdn.domain.com in cdn.conf) win over
#                     the wildcard. Drop the legacy block (and the wildcard certificate) once no old link is in use.
# Certificates: fullchain/privkey for domain.com (+ legacy.* = a *.domain.com certificate while the legacy block exists).
server {
    listen 80;
    server_name domain.com *.domain.com;
    location /.well-known/acme-challenge/ { root /var/www/html/public; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name domain.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /build/ { access_log off; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    # uploaded public media is served by the cdn vhost; storage/app/private is never exposed.
    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }
}

# Legacy shop subdomains: every request goes to Laravel (no static files), which answers 301 → https://domain.com/same/path?query
# (LegacyHostRedirect) or serves webhooks/* and api/* directly.
server {
    listen 443 ssl;
    http2 on;
    server_name *.domain.com;
    ssl_certificate     /etc/nginx/certs/legacy-fullchain.pem;   # *.domain.com
    ssl_certificate_key /etc/nginx/certs/legacy-privkey.pem;

    root /var/www/html/public;
    server_tokens off;
    client_max_body_size 16m;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\. { deny all; }

    location / { rewrite ^ /index.php last; }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }
}
