components:
  securitySchemes:
    customerToken:
      type: http
      scheme: bearer
      description: Sanctum token with ability `customer` (POST /auth/login)
    affiliateToken:
      type: http
      scheme: bearer
      description: Sanctum token with ability `affiliate` (POST /affiliate/login)
  parameters:
    XTenant:
      name: X-Tenant
      in: header
      required: false
      deprecated: true
      description: Sent by old app builds only (former store slug). Ignored by the server (any value); not referenced by any operation.
      schema:
        type: string
        example: egy
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: ar | en (limited to the store locales)
      schema:
        type: string
        example: ar
    XCartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: Guest cart token, returned in the X-Cart-Token response header
      schema:
        type: string
    XAffiliateRef:
      name: X-Affiliate-Ref
      in: header
      required: false
      description: Affiliate ref (uuid) of a shared link, for commission attribution
      schema:
        type: string
    XAttribution:
      name: X-Attribution
      in: header
      required: false
      description: 'Growth first-touch attribution: base64url(JSON) of {utm_source, utm_medium, utm_campaign, utm_content, ref, link, gift_session,
        ab}, max 1024 chars. Stored on the cart (first touch wins) and copied to the order channel at checkout. Malformed values are ignored.'
      schema:
        type: string
        maxLength: 1024
  schemas:
    GiftItem:
      type: object
      description: One Gift Finder suggestion. Bundle-only fields are present when type=bundle, product-only ones when type=product.
      properties:
        type:
          type: string
          enum: [product, bundle]
        key:
          type: string
          example: bundle:3
        id:
          type: integer
        product_id:
          type: integer
        bundle_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        price:
          type: string
          example: '95.00'
        image:
          type: string
          nullable: true
        fit:
          type: number
        category_match:
          type: boolean
          nullable: true
        recipient_match:
          type: boolean
        occasion_match:
          type: boolean
        explanation:
          type: string
          nullable: true
        over_budget:
          type: boolean
        simple:
          type: boolean
        picker:
          type: object
          nullable: true
        regular_total:
          type: string
        savings:
          type: string
        savings_percent:
          type: integer
        available:
          type: integer
          nullable: true
        in_stock:
          type: boolean
        components:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              variant_id:
                type: integer
              name:
                type: string
              slug:
                type: string
              quantity:
                type: integer
              unit_price:
                type: string
              image:
                type: string
                nullable: true
    GiftSearchResult:
      type: object
      properties:
        token:
          type: string
        share_url:
          type: string
        budget:
          type: number
        filters:
          type: object
          properties:
            type:
              type: string
            sort:
              type: string
        answers:
          type: object
        relaxed:
          type: array
          items:
            type: string
            enum: [category, occasion]
        relaxed_notice:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/GiftItem'
        near_items:
          type: array
          items:
            $ref: '#/components/schemas/GiftItem'
        results:
          type: array
          description: legacy - products only (unchanged shape, price is a number)
          items:
            type: object
        bundles:
          type: array
          description: legacy - best bundles, GET /bundles shape (+ fit, explanation)
          items:
            type: object
        near_budget:
          type: array
          description: legacy - near-budget products
          items:
            type: object
        shared:
          type: boolean
          description: only on GET /gift-finder/{token}
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type:
          - string
          - 'null'
        data: {}
        meta:
          type: object
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        data:
          type: 'null'
        meta:
          type: object
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
security: []
