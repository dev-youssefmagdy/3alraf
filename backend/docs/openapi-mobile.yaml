openapi: 3.1.0
info:
  title: 3alraf Mobile API
  version: 1.2.0
  description: 'JSON API for the 3alraf customer mobile app. Full narrative contract (headers, envelope, pagination, errors, rate limits, flows):
    docs/MOBILE_API.md.


    Single store: one base URL (APP_URL/api/v1). GET /app-config returns the switches plus `store` (name, country, currency, locales, timezone);
    GET /store the full profile. The `X-Tenant` header of old app builds is ignored and old `{slug}.` hosts still answer /api/* (URLs in responses
    always use APP_URL). GET /tenants is deprecated (one-item list in the old shape).

    Envelope: {success, message, data, meta}; errors {success:false, message, errors?, data:null, meta:{}} with 401/403/404/422/429. Money is
    a decimal string.

    Auth: Sanctum bearer tokens; customer (ability `customer`) and affiliate (ability `affiliate`) tokens are not interchangeable.

    Guests: persist the `X-Cart-Token` response header and send it on cart/checkout calls.

    '
servers:
- url: https://example.com/api/v1
  description: Site host (APP_URL). The mobile app always uses this one base URL.
paths:
  /addresses:
    get:
      summary: Saved addresses (default first)
      operationId: addresses_index_get
      tags:
      - addresses
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - customerToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: null
                data:
                - id: 1
                  label: Home
                  name: Ali
                  phone: '01000000100'
                  phone_country_code: '+20'
                  phone_full: '+201000000100'
                  city_id: 1
                  city: Cairo
                  address: St 1
                  notes: null
                  is_default: true
                meta: {}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Saved addresses (default first).
    post:
      summary: Create an address (the first one becomes default)
      operationId: addresses_store_post
      tags:
      - addresses
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - customerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                phone_country_code:
                  type: string
                city_id:
                  type: string
                address:
                  type: string
                notes:
                  type: string
                is_default:
                  type: boolean
              required:
              - name
              - phone
              - city_id
              - address
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Example
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: Saved successfully.
                data:
                  id: 1
                  label: Home
                  name: Ali
                  phone: '01000000100'
                  phone_country_code: '+20'
                  phone_full: '+201000000100'
                  city_id: 1
                  city: Cairo
                  address: St 1
                  notes: null
                  is_default: true
                meta: {}
      description: 'Create an address (the first one becomes default).


        Body (`*` required): `name`*, `phone`*, `phone_country_code`, `city_id`*, `address`*, `label`, `notes`, `is_default`


        Rate limit 30/min.'
  /addresses/{id}:
    put:
      summary: Update an address (another customer's id = 404)
      operationId: addresses_update_put
      tags:
      - addresses
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      security:
      - customerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                name:
                  type: string
                phone:
                  type: string
                phone_country_code:
                  type: string
                city_id:
                  type: string
                address:
                  type: string
                notes:
                  type: string
                is_default:
                  type: boolean
              required:
              - name
              - phone
              - city_id
              - address
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Update an address (another customer''s id = 404).


        Body (`*` required): Same as create'
    delete:
      summary: Delete an address
      operationId: addresses_destroy_delete
      tags:
      - addresses
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      security:
      - customerToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Delete an address.
  /affiliate/dashboard:
    get:
      summary: Stats, tier, commissions, payouts
      operationId: affiliate_dashboard_get
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - affiliateToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: null
                data:
                  affiliate:
                    id: 1
                    name: Demo Affiliate
                    email: aff@egy.test
                    phone: null
                    phone_country_code: null
                    phone_full: null
                    status: approved
                    ref: b898c8e1-9c85-4582-87da-cff21b70fb32
                  stats:
                    clicks: 0
                    orders: 0
                    conversion_percent: 0
                    lifetime_sales: '0.00'
                    tier:
                      name: Starter
                      percent: '5.00'
                      min_sales: '0.00'
                    next_tier:
                      name: Silver
                      percent: '7.00'
                      min_sales: '1000.00'
                    commissions:
                      pending: '0.00'
                      approved: '0.00'
                      paid: '0.00'
                      available: '0.00'
                  payouts: []
                  recent_commissions: []
                meta: {}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Stats, tier, commissions, payouts.
  /affiliate/login:
    post:
      summary: Sign in (approved affiliates only)
      operationId: affiliate_login_post
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                remember:
                  type: boolean
              required:
              - email
              - password
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: Welcome back!
                data:
                  token: 12|AbCdEf...
                  token_type: Bearer
                  abilities:
                  - affiliate
                  affiliate:
                    id: 1
                    name: Demo Affiliate
                    email: aff@egy.test
                    phone: null
                    phone_country_code: null
                    phone_full: null
                    status: approved
                    ref: b898c8e1-9c85-4582-87da-cff21b70fb32
                meta: {}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Sign in (approved affiliates only).


        Body (`*` required): `email`*, `password`*'
  /affiliate/logout:
    post:
      summary: Revoke the token
      operationId: affiliate_logout_post
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - affiliateToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Revoke the token.
  /affiliate/me:
    get:
      summary: Profile; `ref` is the uuid used in share links / `X-Affiliate-Ref`
      operationId: affiliate_me_get
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - affiliateToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: null
                data:
                  id: 1
                  name: Demo Affiliate
                  email: aff@egy.test
                  phone: null
                  phone_country_code: null
                  phone_full: null
                  status: approved
                  ref: b898c8e1-9c85-4582-87da-cff21b70fb32
                meta: {}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Profile; `ref` is the uuid used in share links / `X-Affiliate-Ref`.
  /affiliate/payouts:
    get:
      summary: Payout history
      operationId: affiliate_payouts_get
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - affiliateToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: null
                data: []
                meta: {}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Payout history.
    post:
      summary: Request a payout of the approved balance
      operationId: affiliate_payouts_request_post
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - affiliateToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: No approved commission available for payout.
                errors:
                  amount:
                  - No approved commission available for payout.
                data: null
                meta: {}
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Request a payout of the approved balance. 422 when nothing is available.


        Rate limit 5/min.'
  /affiliate/products:
    get:
      summary: Sellable products with the affiliate share `link` and `qr_url`
      operationId: affiliate_products_get
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - affiliateToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: null
                data:
                - id: 2
                  slug: mid
                  name: P mid
                  image: null
                  price: '250.00'
                  link: http://3alraf.test/en/product/mid?utm_source=affiliate&aff=b898c8e1-9c85-4582-87da-cff21b70fb32
                  qr_url: http://3alraf.test/api/v1/affiliate/products/mid/qr
                  variants: []
                meta: {}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Sellable products with the affiliate share `link` and `qr_url`.
  /affiliate/products/{slug}/qr:
    get:
      summary: PNG QR of the share link (binary)
      operationId: affiliate_qr_get
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      - name: slug
        in: path
        required: true
        schema:
          type: string
      security:
      - affiliateToken: []
      responses:
        '200':
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'PNG QR of the share link (binary).


        Binary response (`image/png`).'
  /affiliate/register:
    post:
      summary: Apply as an affiliate
      operationId: affiliate_register_post
      tags:
      - affiliate
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                phone_country_code:
                  type: string
                password:
                  type: string
              required:
              - name
              - email
              - password
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Example
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: Registered. Your account is awaiting approval.
                data:
                  id: 2
                  name: New
                  email: newaff@x.test
                  phone: null
                  phone_country_code: null
                  phone_full: null
                  status: pending
                  ref: b898c8e1-9c85-4582-87da-cff21b70fb32
                meta: {}
      description: 'Apply as an affiliate. No token until an admin approves.


        Body (`*` required): `name`*, `email`*, `password`*, `password_confirmation`*, `phone`, `phone_country_code`'
  /app-config:
    get:
      summary: Force-update and maintenance switches (config/mobile.php + env) + shop basics
      operationId: app-config_get
      tags:
      - app-config
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: version
        in: query
        required: false
        schema:
          type: string
          example: 1.0.0
        description: App version; fills update_required/update_available
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: null
                meta: {}
                data:
                  min_version: 1.0.0
                  latest_version: 1.0.0
                  store_urls:
                    ios: null
                    android: null
                  maintenance: false
                  maintenance_message: null
                  update_required: true
                  update_available: true
                  store:
                    name: 3alraf Egypt
                    country: EG
                    currency:
                      code: EGP
                      symbol: EGP
                    default_locale: ar
                    locales:
                    - code: ar
                      rtl: true
                    - code: en
                      rtl: false
                    timezone: Africa/Cairo
                    base_url: http://3alraf.test
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Force-update and maintenance switches (config/mobile.php + env) and the shop basics `store` (Settings > General: name, country,
        currency {code, symbol}, default_locale, locales [{code, rtl}], timezone, base_url = APP_URL). `Accept-Language` selects the maintenance message (`ar`/`en`).


        Query/params: `version` (optional): the app version, e.g. `1.2.0`. When given, `update_required` (version < min_version) and `update_available`
        (version < latest_version) are filled, otherwise `null`.


        `min_version` / `latest_version` are `x.y.z`. Env: `MOBILE_MIN_VERSION`, `MOBILE_LATEST_VERSION`, `MOBILE_STORE_URL_IOS|ANDROID`, `MOBILE_MAINTENANCE`,
        `MOBILE_MAINTENANCE_MESSAGE_AR|EN`. Rate limit 120/min/IP. Never blocked by maintenance itself.'
  /auth/email/verification-notification:
    post:
      summary: Send the e-mail verification code
      operationId: auth_verification_send_post
      tags:
      - auth
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - customerToken: []
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: A verification code has been sent to your e-mail.
                data: null
                meta: {}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Send the e-mail verification code. 422 when already verified.


        Rate limit 5/min.'
  /auth/email/verify:
    post:
      summary: Verify the e-mail with the code
      operationId: auth_verification_verify_post
      tags:
      - auth
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      security:
      - customerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
              - code
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing / wrong-type / revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Verify the e-mail with the code. Returns the customer.


        Body (`*` required): `code`*'
  /auth/forgot-password:
    post:
      summary: Send a 6-digit reset code by e-mail
      operationId: auth_forgot_post
      tags:
      - auth
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                success: true
                message: If the e-mail exists, a reset code has been sent.
                data: null
                meta: {}
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Send a 6-digit reset code by e-mail. Always 200 (does not reveal whether the e-mail exists).


        Body (`*` required): `email`*


        Rate limit 5/min.'
  /auth/google:
    post:
      summary: Google sign-in with an ID token from the Google SDK (verified server side)
      operationId: auth_google_post
      tags:
      - auth
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCartToken'
      - $ref: '#/components/parameters/XAffiliateRef'
      - $ref: '#/components/parameters/XAttribution'
      responses:
        '200':
          description: Success (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
