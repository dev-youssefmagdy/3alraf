name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: 3alraf_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: 3alraf_test
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_CENTRAL_DOMAIN: 3alraf.test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, gd, zip, intl, pdo_mysql, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Prepare environment
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress --prefer-dist
          php artisan key:generate
      - name: Build front-end
        run: |
          npm ci
          npm run build
      - name: Route list (must boot cleanly)
        run: php artisan route:list --compact > /dev/null
      - name: Pest
        run: vendor/bin/pest --compact
